spring.application.name=topology-service

# Server Port
server.port=8084

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/digital_twin_platform
spring.datasource.username=root
spring.datasource.password=Koushik@2004

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=*

# Redis Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# Cluster Sync Service
cluster.sync.base-url=http://localhost:8083
