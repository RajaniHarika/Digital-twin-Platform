spring.application.name=cluster-sync-service

server.port=8083

# ==========================================
# MySQL Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/digital_twin_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Koushik@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Redis Configuration
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# ==========================================
# Logging
# ==========================================
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# ==========================================
# Spring Actuator
# ==========================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always