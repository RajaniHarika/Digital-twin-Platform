## ──────────────────────────────────────────────────────────────
## Ingress — Path-Based Routing Rules
## ──────────────────────────────────────────────────────────────
## Single entry point: <Worker-Public-IP>:30080
##
## Routing:
##   /api/*   → api-gateway:8080   (Spring Cloud Gateway handles
##                                   all internal microservice routing)
##   /        → frontend:80        (React SPA — catch-all)
##
## Traffic flow:
##   Browser
##     └─► Worker :30080  (NodePort)
##           └─► Nginx Ingress Controller (pod in ingress-nginx ns)
##                 ├─► /api/*  ─► api-gateway.digitaltwin:8080
##                 └─► /       ─► frontend.digitaltwin:80
## ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digitaltwin-ingress
  namespace: digitaltwin
  annotations:
    # Use nginx as the ingress class
    kubernetes.io/ingress.class: "nginx"
    # Strip /api prefix before forwarding to api-gateway
    # e.g. /api/auth/login → /auth/login at api-gateway
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Increase proxy timeouts for long-running AI/simulation calls
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # Enable CORS for browser requests from Frontend → API Gateway
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          ## ─── API Gateway ─────────────────────────────────────
          ## All /api/* requests are routed to api-gateway.
          ## The rewrite-target annotation strips /api so Spring
          ## Cloud Gateway sees clean paths like /auth/login.
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

          ## ─── React Frontend ──────────────────────────────────
          ## All other requests (/, /dashboard, /login, etc.) go
          ## to the frontend React app served by Nginx on port 80.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
